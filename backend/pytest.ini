[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*

# Default run: pure logic only. Fast, no credentials, no network, no quota.
#
# Excluding the marked groups explicitly rather than relying on their skip
# conditions: once conftest loads .env, a configured key makes an llm test
# *runnable*, and a default `pytest` would start calling an API.
addopts =
    -m "not slow and not llm and not api and not earthengine"
    --strict-markers
    --tb=short
    -q

markers =
    slow: takes more than a few seconds
    api: needs uvicorn running on localhost:8000
    earthengine: needs Earth Engine authentication, consumes compute quota
    llm: needs GROQ_API_KEY
